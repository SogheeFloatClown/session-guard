name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.0.0"
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: .   # change to session-guard if your files are in that folder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile session_guard.py
      - run: |
          gh release view "$TAG" --repo "${{ github.repository }}" || gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes "Windows build of session-guard"
          cp dist/session_guard.exe session_guard-windows.exe
          gh release upload "$TAG" session_guard-windows.exe --clobber --repo "${{ github.repository }}"
