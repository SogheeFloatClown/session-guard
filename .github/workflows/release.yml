name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "Standalone builds of session-guard"
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: create
    strategy:
      matrix:
        include:
          - os: windows-latest
            built: dist/session_guard.exe
            asset: session_guard-windows.exe
          - os: macos-latest
            built: dist/session_guard
            asset: session_guard-macos
          - os: ubuntu-latest
            built: dist/session_guard
            asset: session_guard-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile session_guard.py
      - shell: bash
        run: |
          cp "${{ matrix.built }}" "${{ matrix.asset }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.asset }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
